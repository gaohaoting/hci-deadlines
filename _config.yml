title: "⏰ TimeLab HCI Deadlines"
description: Countdowns to HCI conference deadlines — TimeLab curated view
author: Andrea Bianchi

domain: 'gaohaoting.github.io'
# This repo is a PROJECT page (repo name != gaohaoting.github.io), so GitHub
# serves it from a sub-path. baseurl must match the repo name or every
# /static and nav link 404s. For local dev, _config.local.yml overrides this to ''.
baseurl: '/hci-deadlines.github.io'

# Lab-wide conference filter (see _data/local_filter.yml)
local_mode: true

twitter_hashtag: hci-deadlines
github_username: gaohaoting
github_repo_confdatabase: conf-database

markdown: kramdown
ga_id:

include: ['_pages']
exclude: ['CLAUDE.md', 'README.md', 'LICENSE', 'utils', 'bin', 'Gemfile', 'Gemfile.lock', 'vendor']
