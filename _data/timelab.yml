# TIME Lab — curated HCI venue calendar for 2026–2027.
#
# Each entry references a conference `id` from _data/conferences.yml. The
# submission/abstract deadline, conference dates, place, link and subject tag are
# looked up live from there, so they stay correct when the database updates.
#
# Fields you maintain HERE (not in conferences.yml):
#   id            - must match an `id` in _data/conferences.yml
#   intent        - submitted | plan | watch | tbd
#                   submitted = 已提交  |  plan = 计划投稿
#                   watch = 观察跟进    |  tbd = 待定
#   calendar      - optional; set false to hide the Google Calendar button
#   note          - optional free-form personal note
#
# To add a venue: find its id in conferences.yml and add an entry below.

title: "TIME Lab — HCI Venue Calendar 2026–2027"
intro: >-
  TIME Lab HCI Venue Calendar 2026–2027.

venues:
  - id: chi27
    intent: plan
    note: "Primary target. Full paper deadline 2026-09-10 (AoE)."

  - id: uist26
    intent: plan

  - id: cscw26
    intent: watch

  - id: dis26
    intent: watch

  - id: assets26
    intent: tbd

  - id: vrst26
    intent: tbd
